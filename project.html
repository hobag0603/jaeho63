<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Park Jaeho</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="header">
    <a href="index.html" class="brand">park jaeho</a>
    <nav class="nav">
      <a href="works.html" class="active">works</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </nav>
  </header>

  <main class="container">
    <div class="project-detail">
      <div class="project-top-nav">
        <a href="works.html">← All projects</a>
      </div>

      <div class="project-category" id="p-category"></div>

      <div class="project-lead-grid">
        <div class="project-lead-media">
          <figure class="project-figure has-img">
            <img id="p-main-img" src="" alt="">
          </figure>
        </div>

        <div class="project-side-details">
          <h1 class="side-title" id="p-title"></h1>
          <div id="p-details"></div>
        </div>
      </div>

      <div class="project-body-column">
        <div class="md-content" id="p-md-body"></div>
      </div>
    </div>
  </main>

  <div class="shark-mover bg-shark" id="shark" data-mode="background">
    <img src="images/shark.png" alt="shark" class="swim-img">
  </div>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const project = PROJECTS.find(p => p.id === id) || PROJECTS[0];

    if (project) {
      document.title = `${project.title} — Park Jaeho`;
      document.getElementById("p-category").textContent = project.category || "";
      document.getElementById("p-title").textContent = project.title || "";

      const mainImg = document.getElementById("p-main-img");
      mainImg.src = encodeURI(project.mainImage);
      mainImg.alt = project.title;

      const detailsEl = document.getElementById("p-details");
      detailsEl.innerHTML = (project.details || []).map(d => `
        <div class="detail-item">
          <div class="detail-label">${d.label}</div>
          <div class="detail-value">${d.value}</div>
        </div>
      `).join("");

      if (project.mdFile) {
        fetch(encodeURI(project.mdFile))
          .then(res => res.ok ? res.text() : "")
          .then(text => {
            if (!text) return;
            const safeMd = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
              const cleanUrl = url.trim().replace(/^(\.\.\/)+|^\/+/, "");
              return `![${alt}](${encodeURI(cleanUrl)})`;
            });
            document.getElementById("p-md-body").innerHTML = marked.parse(safeMd);
          })
          .catch(() => {});
      }
    }
  </script>
  <script src="shark.js"></script>
</body>
</html>
