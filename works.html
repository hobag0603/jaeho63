<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>works — park jaeho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="brand">park jaeho</a>
    <nav class="nav">
      <a href="works.html" class="active">works</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </nav>
  </header>

  <main class="container" id="works-container"></main>

  <div class="shark-mover bg-shark" id="shark" data-mode="background">
    <img src="images/shark.png" alt="shark" class="swim-img">
  </div>

  <script src="data.js"></script>
  <script>
    const container = document.getElementById("works-container");

    const sections = [
      { title: "Academic", filter: p => p.id.startsWith("studio-") },
      { title: "Archive", filter: p => p.id.startsWith("archive-") },
      { title: "Competition", filter: p => p.id.startsWith("comp-") }
    ];

    container.innerHTML = sections.map(sec => {
      const items = PROJECTS.filter(sec.filter);
      if (items.length === 0) return "";

      const cards = items.map(p => `
        <a href="project.html?id=${p.id}" class="work-card">
          <div class="thumb-wrap">
            <span class="thumb-placeholder">준비중</span>
            <img src="${encodeURI(p.mainImage)}" alt="${p.title}" onerror="this.style.display='none'">
          </div>
          <div class="work-info">
            <div class="work-title">${p.title}</div>
            <div class="work-sub">${p.subtitle || p.category}</div>
          </div>
        </a>
      `).join("");

      return `
        <section class="work-section">
          <h2 class="section-title">${sec.title}</h2>
          <div class="work-grid">${cards}</div>
        </section>
      `;
    }).join("");
  </script>
  <script src="shark.js"></script>

</body>
</html>
